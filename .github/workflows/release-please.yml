name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # release-please's own GITHUB_TOKEN release doesn't trigger release.yml's
  # `release: published` event (Actions skips events from GITHUB_TOKEN to
  # avoid recursive runs), so publish here instead, in the same run.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mivia/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/ -v --tb=short
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
