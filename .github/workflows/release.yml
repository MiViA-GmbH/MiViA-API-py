name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mivia/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject.toml version matches tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag_version="${tag#mivia-}"
          tag_version="${tag_version#v}"
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag_version pyproject=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $tag_version does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/ -v --tb=short
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
